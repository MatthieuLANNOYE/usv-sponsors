<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sponsors – US Vermelles</title>
  <style>
    /* ============================================================
       CONFIGURATION VISUELLE — modifier ici si besoin
    ============================================================ */
    :root {
      --color-bg:       #0a0f1e;
      --color-card:     #111827;
      --color-accent:   #e8b020;      /* Couleur principale (doré) */
      --color-accent2:  #ffffff;
      --color-text:     #f0f0f0;
      --color-subtle:   #8899aa;
      --duration-show:  5000;         /* Durée d'affichage par sponsor (ms) */
      --duration-fade:  800;          /* Durée de transition (ms) */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: 'Georgia', serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      flex-direction: column;        /* ← changé */
      align-items: stretch;          /* ← changé */
      padding: 18px 40px 0;          /* ← plus de padding bas */
      background: linear-gradient(180deg, #111827 0%, transparent 100%);
      flex-shrink: 0;
    }

    .header-content {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-bottom: 14px;
      width: 100%;
    }

    .chevalement-icon {
      width: 38px;
      height: 50px;
      flex-shrink: 0;
      opacity: 0.85;
    }

    .header-terril {
      width: 100%;
      height: 32px;
      display: block;
      overflow: visible;
    }

    .club-badge {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--color-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #0a0f1e;
      flex-shrink: 0;
      letter-spacing: -1px;
    }

    .club-badge-img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: contain;
      flex-shrink: 0;
    }

    .club-title {
      display: flex;
      flex-direction: column;
    }

    .club-name {
      font-size: clamp(16px, 2vw, 24px);
      font-weight: bold;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-accent);
    }

    .club-subtitle {
      font-size: clamp(11px, 1.2vw, 15px);
      color: var(--color-subtle);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .header-label {
      margin-left: auto;
      font-size: clamp(13px, 1.5vw, 18px);
      color: var(--color-accent);           /* doré au lieu de subtle */
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border: 1px solid var(--color-accent); /* bordure dorée */
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: bold;
      text-shadow: 0 0 12px rgba(232,176,32,0.4); /* légère lueur */
      box-shadow: 0 0 10px rgba(232,176,32,0.15);  /* halo extérieur */
    }

    /* === ZONE PRINCIPALE === */
    main {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fond décoratif */
    main::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 60% at 50% 50%, #1a2540 0%, transparent 70%);
      pointer-events: none;
    }

    /* Coins décoratifs */
    main::after {
      content: '';
      position: absolute;
      inset: 30px 20px 20px;   /* top plus grand = cadre descend */
      border: 1px solid #1e2d45;
      border-radius: 4px;
      pointer-events: none;
    }

    /* === CARTE SPONSOR === */
    .sponsor-card {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 3vh, 40px);
      padding: 40px 60px;
      opacity: 0;
      transform: scale(0.97);
      transition:
        opacity calc(var(--duration-fade) * 1ms) ease,
        transform calc(var(--duration-fade) * 1ms) ease;
      max-width: 80vw;
      text-align: center;
    }

    .sponsor-card.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Cadre logo */
    .logo-frame {
      width: clamp(200px, 30vw, 420px);
      height: clamp(130px, 20vh, 260px);
      background: #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 36px;
      box-shadow:
        0 0 0 3px var(--color-accent),
        0 20px 60px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .logo-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Fallback si pas de logo : initiales */
    .logo-placeholder {
      font-size: clamp(40px, 6vw, 90px);
      font-weight: bold;
      color: var(--color-accent);
      letter-spacing: -2px;
      font-family: 'Georgia', serif;
      line-height: 1;
    }

    /* Nom du sponsor */
    .sponsor-name {
      font-size: clamp(22px, 4vw, 58px);
      font-weight: bold;
      letter-spacing: 0.06em;
      color: var(--color-accent2);
      text-transform: uppercase;
      line-height: 1.1;
    }

    /* Catégorie optionnelle */
    .sponsor-category {
      font-size: clamp(12px, 1.5vw, 18px);
      color: var(--color-subtle);
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /* Ligne décorative sous le nom */
    .sponsor-divider {
      width: 60px;
      height: 3px;
      background: var(--color-accent);
      border-radius: 2px;
    }

    .sponsor-location,
    .sponsor-contact {
      font-size: clamp(12px, 1.5vw, 18px);
      color: var(--color-subtle);
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .sponsor-location::before { content: '📍 '; }
    .sponsor-contact::before  { content: '📞 '; }

    /* === DIAPO SLOGAN CLUB === */
    .club-slide {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 3vh, 36px);
      padding: 40px 80px;
      opacity: 0;
      transform: scale(0.97);
      transition:
        opacity calc(var(--duration-fade) * 1ms) ease,
        transform calc(var(--duration-fade) * 1ms) ease;
      text-align: center;
      max-width: 90vw;
    }

    .club-slide.active {
      opacity: 1;
      transform: scale(1);
    }

    .club-slide .badge-lg {
      width: clamp(80px, 12vw, 140px);
      height: clamp(80px, 12vw, 140px);
      border-radius: 50%;
      background: var(--color-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 4.5vw, 56px);
      font-weight: bold;
      color: #0a0f1e;
      letter-spacing: -2px;
      box-shadow: 0 0 0 4px #0a0f1e, 0 0 0 7px var(--color-accent), 0 20px 60px rgba(232,176,32,0.3);
      flex-shrink: 0;
    }

    .club-slide .slogan-line {
      display: block;
      font-size: clamp(28px, 5vw, 72px);
      font-weight: bold;
      letter-spacing: 0.04em;
      color: var(--color-accent2);
      line-height: 1.15;
    }

    .club-slide .slogan-line em {
      font-style: normal;
      color: var(--color-accent);
    }

    .club-slide .club-full-name {
      font-size: clamp(12px, 1.6vw, 20px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--color-subtle);
      margin-top: 4px;
    }

    .club-slide .ornament {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--color-accent);
      opacity: 0.6;
    }

    .club-slide .ornament::before,
    .club-slide .ornament::after {
      content: '';
      display: block;
      width: clamp(40px, 6vw, 100px);
      height: 1px;
      background: var(--color-accent);
      opacity: 0.5;
    }

    /* === FOOTER — barre de progression === */
    footer {
      flex-shrink: 0;
      padding: 0 0 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* Points de navigation */
    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2a3550;
      transition: background 0.4s, transform 0.4s;
    }

    .dot.active {
      background: var(--color-accent);
      transform: scale(1.4);
    }

    /* Barre de progression */
    .progress-track {
      width: min(500px, 60vw);
      height: 3px;
      background: #1a2540;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--color-accent);
      border-radius: 2px;
      width: 0%;
      transition: none;
    }

    .progress-bar.running {
      transition: width linear;
    }

    .merci {
      font-size: clamp(10px, 1.2vw, 13px);
      color: var(--color-subtle);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    #particles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* S'assurer que les slides passent au-dessus du canvas */
    .sponsor-card,
    .club-slide {
      z-index: 1;
    }
  </style>
</head>

<script>
  /* ── Helpers ── */
  function initiales(name) {
    return name.split(' ')
      .filter(w => w.length > 2)
      .slice(0, 2)
      .map(w => w[0].toUpperCase())
      .join('');
  }

  /* ── Construction de la séquence (sponsors + diapos slogan intercalées) ── */
  const stage = document.getElementById('stage');
  const dotsEl = document.getElementById('dots');
  const bar    = document.getElementById('progressBar');

  /* Construit la liste finale des slides (sponsor ou club) */
  const sequence = [];
  SPONSORS.forEach((sp, i) => {
    sequence.push({ type: 'sponsor', data: sp });
    if (SLOGAN_TOUS_LES_N > 0 && (i + 1) % SLOGAN_TOUS_LES_N === 0) {
      sequence.push({ type: 'club' });
    }
  });
  /* Toujours commencer par la diapo club si on n'a pas beaucoup de sponsors */
  if (SLOGAN_TOUS_LES_N > 0 && SPONSORS.length < SLOGAN_TOUS_LES_N) {
    sequence.push({ type: 'club' });
  }

  /* Crée les éléments DOM pour chaque slide */
  const slides = sequence.map((item) => {
    let el;

    if (item.type === 'club') {
      /* ── Diapo slogan ── */
      el = document.createElement('div');
      el.className = 'club-slide';

      /* Découpe le slogan pour mettre en valeur le dernier bout */
      const parts = SLOGAN.split(',');
      const sloganEl = document.createElement('span');
      sloganEl.className = 'slogan-line';
      if (parts.length >= 2) {
        sloganEl.innerHTML =
          parts.slice(0, -1).join(',') + ',<br><em>' + parts[parts.length - 1].trim() + '</em>';
      } else {
        sloganEl.textContent = SLOGAN;
      }

      const badge = document.createElement('img');
      badge.className = 'badge-lg';
      badge.src = 'logos/logo-usv.png';
      badge.alt = 'USV';
      badge.style.objectFit = 'contain';
      badge.style.padding = '10px';
      badge.style.background = 'var(--color-accent)';

      const ornament = document.createElement('div');
      ornament.className = 'ornament';
      ornament.textContent = '⚽';

      const fullName = document.createElement('div');
      fullName.className = 'club-full-name';
      fullName.textContent = 'Union Sportive de Vermelles';

      el.appendChild(badge);
      el.appendChild(sloganEl);
      el.appendChild(ornament);
      el.appendChild(fullName);

    } else {
      /* ── Diapo sponsor ── */
      const sp = item.data;
      el = document.createElement('div');
      el.className = 'sponsor-card';

      const frame = document.createElement('div');
      frame.className = 'logo-frame';

      if (sp.logo) {
        const img = document.createElement('img');
        img.src = sp.logo;
        img.alt = sp.name;
        frame.appendChild(img);
      } else {
        const ph = document.createElement('div');
        ph.className = 'logo-placeholder';
        ph.textContent = initiales(sp.name) || sp.name.slice(0, 2).toUpperCase();
        frame.appendChild(ph);
      }

      const name = document.createElement('div');
      name.className = 'sponsor-name';
      name.textContent = sp.name;

      const divider = document.createElement('div');
      divider.className = 'sponsor-divider';

      el.appendChild(frame);
      el.appendChild(name);

      if (sp.location) {
        const loc = document.createElement('div');
        loc.className = 'sponsor-location';
        loc.textContent = sp.location;
        el.appendChild(loc);
      }

      if (sp.contact) {
        const tel = document.createElement('div');
        tel.className = 'sponsor-contact';
        tel.textContent = sp.contact;
        el.appendChild(tel);
      }

      el.appendChild(divider);

      if (sp.category) {
        const cat = document.createElement('div');
        cat.className = 'sponsor-category';
        cat.textContent = sp.category;
        el.appendChild(cat);
      }
    }

    stage.appendChild(el);

    /* Point de navigation (doré pour club, normal pour sponsor) */
    const dot = document.createElement('div');
    dot.className = 'dot' + (item.type === 'club' ? ' dot-club' : '');
    dotsEl.appendChild(dot);

    return { el, dot, type: item.type };
  });

  /* Style spécial pour le point de navigation du club */
  const style = document.createElement('style');
  style.textContent = `.dot-club { background: #e8b020 !important; opacity: 0.4; border-radius: 3px !important; width: 16px !important; }
  .dot-club.active { opacity: 1 !important; transform: scale(1.2) !important; }`;
  document.head.appendChild(style);

  /* ── Logique de défilement ── */
  let current = 0;

  function showSlide(idx) {
    slides.forEach(({ el, dot }, i) => {
      el.classList.toggle('active', i === idx);
      dot.classList.toggle('active', i === idx);
    });

    bar.classList.remove('running');
    bar.style.width = '0%';
    void bar.offsetWidth;
    bar.style.transition = `width ${DUREE_MS}ms linear`;
    bar.classList.add('running');
    bar.style.width = '100%';
  }

  function next() {
    current = (current + 1) % slides.length;
    showSlide(current);
  }

  showSlide(0);
  setInterval(next, DUREE_MS);

  /* ── Particules dorées ── */
  const canvas = document.getElementById('particles');
  const ctx    = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width  = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const PARTICLE_COUNT = 55;

  const particles = Array.from({ length: PARTICLE_COUNT }, () => ({
    x:       Math.random() * canvas.width,
    y:       Math.random() * canvas.height,
    r:       Math.random() * 1.8 + 0.4,       // rayon 0.4 → 2.2px
    speedX:  (Math.random() - 0.5) * 0.25,
    speedY:  -(Math.random() * 0.4 + 0.1),    // remonte doucement
    opacity: Math.random() * 0.5 + 0.1,
    flicker: Math.random() * Math.PI * 2,     // phase de scintillement
  }));

  function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      /* Scintillement */
      p.flicker += 0.03;
      const alpha = p.opacity * (0.6 + 0.4 * Math.sin(p.flicker));

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(232, 176, 32, ${alpha})`;
      ctx.fill();

      /* Mouvement */
      p.x += p.speedX;
      p.y += p.speedY;

      /* Réapparition en bas si hors écran */
      if (p.y < -5) {
        p.y = canvas.height + 5;
        p.x = Math.random() * canvas.width;
      }
      if (p.x < -5)               p.x = canvas.width + 5;
      if (p.x > canvas.width + 5) p.x = -5;
    });

    requestAnimationFrame(drawParticles);
  }

  drawParticles();
</script>
</body>
</html>
